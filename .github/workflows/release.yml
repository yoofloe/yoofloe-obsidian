name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing validated release tag"
        required: true
        type: string
      draft:
        description: "Keep the verified release assets in a draft"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check the release source
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Run this workflow from the commit identified by the release tag."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attest the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Verify release file attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in main.js styles.css; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          files: |
            main.js
            manifest.json
            styles.css
